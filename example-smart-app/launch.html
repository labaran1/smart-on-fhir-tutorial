<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Health App - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .login-container {
      background: #fff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 1em;
    }
    .login-container label {
      display: block;
      margin-top: 10px;
    }
    .login-container input[type="email"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border: none;
      border-radius: 4px;
      background: #007BFF;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .login-container button:hover {
      background: #0056b3;
    }
    .separator {
      text-align: center;
      margin: 20px 0;
      position: relative;
    }
    .separator::before,
    .separator::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ccc;
    }
    .separator::before {
      left: 0;
    }
    .separator::after {
      right: 0;
    }
    .separator span {
      background: #fff;
      padding: 0 10px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
      
      <button type="submit">Login</button>
    </form>
    
    <div class="separator"><span>OR</span></div>
    
    <button type="button" onclick="loginSSO()">Login with SSO</button>
  </div>

  <script>
    function loginSSO() {
      FHIR.oauth2.authorize({
        clientId: '6c9c4671-8aad-436c-8fdd-a842e8a71a6c',
        scope: "launch patient/*.read launch online_access openid profile",
        redirectUri: 'https://labaran1.github.io/smart-on-fhir-tutorial/example-smart-app/index.html',
        fhirServiceUrl: "https://r3.smarthealthit.org"
      });
    }
  </script>
</body>
</html>
