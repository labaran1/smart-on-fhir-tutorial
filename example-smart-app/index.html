<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SMART App</title>
  <script src="./lib/js/fhir-client-v0.1.12.js"></script>
</head>
<body>
  <h1>Welcome to Your SMART App</h1>
  <div id="patient-info"></div>
  <script>
    FHIR.oauth2.ready()
      .then(client => {
        // Fetch patient data
        client.request("Patient")
          .then(patient => {
            document.getElementById("patient-info").innerHTML = 
              `<p>Patient Name: ${patient.name[0].given[0]} ${patient.name[0].family}</p>
               <p>Birth Date: ${patient.birthDate}</p>`;
          })
          .catch(console.error);
      })
      .catch(console.error);
  </script>
</body>
</html>
